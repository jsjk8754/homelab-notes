<a class="project-row" href="{{ .page.RelPermalink }}">
  <span class="row-index">{{ printf "%02d" .index }}</span>
  <div class="row-copy"><h3>{{ .page.Title }}</h3><p>{{ .page.Params.summary }}</p></div>
  <div class="stack">{{ range first 2 .page.Params.stack }}<span>{{ . }}</span>{{ end }}</div>
  {{ partial "arrow.html" . }}
</a>
