{{ define "main" }}<section class="shell search-page" data-search-page><header class="page-heading"><h1>Search</h1><p>프로젝트와 기술 노트에서 필요한 기록을 찾아보세요.</p></header><label class="visually-hidden" for="page-search">검색어</label><input id="page-search" type="search" disabled placeholder="궁금한 주제나 기술을 입력하세요" data-search-input><p class="search-status" data-search-status role="status">검색어를 입력하면 프로젝트와 노트를 함께 찾습니다.</p><ul class="search-results" data-search-results></ul><noscript><p>실시간 검색에는 JavaScript가 필요합니다. 아래 전체 목록이나 브라우저의 페이지 내 찾기를 이용하세요.</p></noscript><h2 class="search-index-heading">모든 기록</h2><ul class="search-results">{{ range where site.RegularPages "Section" "in" (slice "projects" "notes") }}<li><a href="{{ .RelPermalink }}"><span>{{ .CurrentSection.Title }}</span><strong>{{ .Title }}</strong><p>{{ .Params.summary }}</p></a></li>{{ end }}</ul></section>{{ end }}
