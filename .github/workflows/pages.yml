name: Build and deploy Hugo site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: "0.166.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Hugo
        shell: bash
        run: |
          archive="$RUNNER_TEMP/hugo.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "$archive"
          echo "45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308  $archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build and verify site
        env:
          BUILD_DESTINATION: public
          CHECK_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: ./scripts/check.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
